name: Deploy to OVH

# Publishes the site to the OVH web root on every push to main.
# Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the server at the same time.
concurrency:
  group: sftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload changed files over SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # DELIBERATE, INSECURE: plain FTP on port 21.
          #
          # Two other options were tried and do not work here:
          #   - protocol: sftp  → FTP-Deploy-Action does not support SFTP at
          #     all; the run dies instantly on "invalid parameter".
          #   - protocol: ftps  → this OVH cluster rejects explicit TLS with
          #     "500 This security scheme is not implemented".
          #
          # So the credentials below cross the network UNENCRYPTED on every
          # deploy. Treat FTP_PASSWORD as compromised and rotate it if it is
          # reused anywhere else. The encrypted alternative is SFTP on port
          # 22, which needs a different action (e.g. wlixcc/SFTP-Deploy-Action).
          protocol: ftp
          port: 21
          # OVH shared hosting serves from www/. Override with the
          # FTP_SERVER_DIR repository variable if your account differs.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'www/' }}
          local-dir: ./
          # Only ever adds and updates. Files already on the server that
          # are not in the repo are left alone, never deleted.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/.DS_Store
            **/node_modules/**
            **/*.md
