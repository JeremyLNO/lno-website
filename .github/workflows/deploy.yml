name: Deploy to OVH

# Publishes the site to the OVH web root on every push to main.
# Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the server at the same time.
concurrency:
  group: sftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # SFTP over SSH on port 22: the credentials and the files are
          # encrypted in transit. This host answers SSH-2.0-OpenSSH_7.9p1.
          # Plain FTP on 21 sent the password in clear text, and FTPS is
          # refused here ("500 This security scheme is not implemented").
          port: 22
          sftp_only: true
          # The './*' glob does not match dotfiles, so .git, .github and
          # .claude are left behind. Verified after deploy: /.github/ 404s.
          local_path: './*'
          remote_path: ${{ vars.FTP_SERVER_DIR || 'www' }}
